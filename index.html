<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DODGE</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050510;
    color: #fff;
    font-family: "Courier New", monospace;
  }

  body {
    display: grid;
    place-items: center;
  }

  #wrap {
    position: relative;
    width: min(96vw, 900px);
    aspect-ratio: 16 / 10;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border: 3px solid #35f2ff;
    background: #07071a;
    box-shadow:
      0 0 12px #35f2ff,
      0 0 40px rgba(255, 35, 220, .35);
    image-rendering: pixelated;
  }

  #hint {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    color: #9dfaff;
    font-size: clamp(9px, 1.3vw, 13px);
    letter-spacing: 1px;
    text-align: center;
    pointer-events: none;
    opacity: .8;
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="hint">MOVE: ← → / A D &nbsp; • &nbsp; SPACE: START / RESTART</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const keys = {};
let state = "title";
let score = 0;
let highScore = Number(localStorage.getItem("neonDodgeHigh") || 0);
let level = 1;
let spawnTimer = 0;
let flash = 0;
let shake = 0;

const player = {
  x: W / 2 - 18,
  y: H - 65,
  w: 36,
  h: 24,
  speed: 6
};

let meteors = [];
let particles = [];
let stars = [];

for (let i = 0; i < 100; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    speed: 0.3 + Math.random() * 1.7,
    size: Math.random() < .8 ? 1 : 2
  });
}

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (
    ["arrowleft", "arrowright", "a", "d", " ", "enter"].includes(
      e.key.toLowerCase()
    )
  ) e.preventDefault();

  if ((e.key === " " || e.key === "Enter") && state !== "playing") {
    startGame();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function startGame() {
  state = "playing";
  score = 0;
  level = 1;
  spawnTimer = 0;
  flash = 0;
  shake = 0;
  meteors = [];
  particles = [];

  player.x = W / 2 - player.w / 2;
  player.y = H - 65;
}

function gameOver() {
  state = "gameover";
  shake = 18;

  if (score > highScore) {
    highScore = score;
    localStorage.setItem("neonDodgeHigh", highScore);
  }

  explode(player.x + player.w / 2, player.y + player.h / 2, "#ff35df", 45);
}

function spawnMeteor() {
  const size = 18 + Math.random() * 27;

  meteors.push({
    x: Math.random() * (W - size),
    y: -size - 10,
    w: size,
    h: size,
    speed: 2.4 + Math.random() * 2 + level * .25,
    rotation: Math.random() * Math.PI,
    spin: (Math.random() - .5) * .08,
    hue: Math.random() < .5 ? "#ff35df" : "#35f2ff"
  });
}

function explode(x, y, color, amount = 18) {
  for (let i = 0; i < amount; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1;

    particles.push({
      x, y,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: 25 + Math.random() * 35,
      maxLife: 60,
      size: 2 + Math.random() * 3,
      color
    });
  }
}

function rectsOverlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function updateStars() {
  for (const s of stars) {
    s.y += s.speed * (state === "playing" ? 1.5 : .5);

    if (s.y > H) {
      s.y = 0;
      s.x = Math.random() * W;
    }
  }
}

function update() {
  updateStars();

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= .97;
    p.vy *= .97;
    p.life--;
  }

  particles = particles.filter(p => p.life > 0);

  if (shake > 0) shake *= .88;
  if (flash > 0) flash--;

  if (state !== "playing") return;

  // Player movement
  if (keys["arrowleft"] || keys["a"]) player.x -= player.speed;
  if (keys["arrowright"] || keys["d"]) player.x += player.speed;

  player.x = Math.max(8, Math.min(W - player.w - 8, player.x));

  // Difficulty
  level = 1 + Math.floor(score / 500);

  spawnTimer--;

  const spawnRate = Math.max(12, 42 - level * 3);

  if (spawnTimer <= 0) {
    spawnMeteor();
    spawnTimer = spawnRate;
  }

  for (const m of meteors) {
    m.y += m.speed;
    m.rotation += m.spin;

    if (rectsOverlap(player, m)) {
      flash = 12;
      gameOver();
      return;
    }
  }

  for (const m of meteors) {
    if (m.y > H + 50 && !m.counted) {
      m.counted = true;
      score += 25;
      explode(m.x + m.w / 2, H - 3, m.hue, 4);
    }
  }

  meteors = meteors.filter(m => m.y < H + 60);

  score++;

  // Occasional bonus particles behind the player
  if (Math.random() < .5) {
    particles.push({
      x: player.x + player.w / 2 + (Math.random() - .5) * 14,
      y: player.y + player.h,
      vx: (Math.random() - .5),
      vy: 1 + Math.random() * 2,
      life: 15,
      maxLife: 15,
      size: 2,
      color: "#35f2ff"
    });
  }
}

function drawBackground() {
  ctx.fillStyle = "#07071a";
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of stars) {
    ctx.fillStyle = s.size === 2
      ? "rgba(255,255,255,.75)"
      : "rgba(90,240,255,.55)";

    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  // Retro grid
  ctx.strokeStyle = "rgba(50, 242, 255, .09)";
  ctx.lineWidth = 1;

  for (let x = 0; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (let y = 0; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Scanlines
  ctx.fillStyle = "rgba(255,255,255,.025)";
  for (let y = 0; y < H; y += 4) {
    ctx.fillRect(0, y, W, 1);
  }
}

function glowText(text, x, y, size, color, align = "center") {
  ctx.save();
  ctx.textAlign = align;
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.shadowBlur = 18;
  ctx.shadowColor = color;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawPlayer() {
  const x = player.x;
  const y = player.y;

  ctx.save();

  ctx.shadowBlur = 18;
  ctx.shadowColor = "#35f2ff";

  // Engine flame
  ctx.fillStyle = "#ff35df";
  ctx.beginPath();
  ctx.moveTo(x + 9, y + player.h);
  ctx.lineTo(x + 14, y + player.h + 15 + Math.random() * 6);
  ctx.lineTo(x + 18, y + player.h);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#35f2ff";
  ctx.beginPath();
  ctx.moveTo(x + 18, y);
  ctx.lineTo(x + player.w, y + player.h);
  ctx.lineTo(x + 18, y + player.h - 5);
  ctx.lineTo(x, y + player.h);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.fillRect(x + 15, y + 7, 7, 7);

  ctx.restore();
}

function drawMeteor(m) {
  const cx = m.x + m.w / 2;
  const cy = m.y + m.h / 2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(m.rotation);

  ctx.shadowBlur = 15;
  ctx.shadowColor = m.hue;
  ctx.strokeStyle = m.hue;
  ctx.lineWidth = 3;
  ctx.fillStyle = "#16162d";

  ctx.beginPath();

  const r = m.w / 2;
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    const rr = r * (.75 + Math.random() * .25);
    const px = Math.cos(a) * rr;
    const py = Math.sin(a) * rr;

    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawHUD() {
  ctx.fillStyle = "#fff";
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = "left";
  ctx.fillText(`SCORE ${String(score).padStart(6, "0")}`, 18, 28);

  ctx.textAlign = "right";
  ctx.fillText(`HI ${String(highScore).padStart(6, "0")}`, W - 18, 28);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ff35df";
  ctx.fillText(`LEVEL ${level}`, W / 2, 28);
}

function drawTitle() {
  glowText("NEON", W / 2, 150, 70, "#35f2ff");
  glowText("DODGE", W / 2, 220, 70, "#ff35df");

  ctx.textAlign = "center";
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.fillStyle = "#fff";
  ctx.fillText("SURVIVE THE FALL", W / 2, 270);

  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillStyle = "#35f2ff";
  ctx.fillText("PRESS SPACE TO PLAY", W / 2, 330);

  ctx.fillStyle = "#777";
  ctx.font = '13px "Courier New", monospace';
  ctx.fillText("A / D or ARROW KEYS TO MOVE", W / 2, 360);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(5,5,16,.72)";
  ctx.fillRect(0, 0, W, H);

  glowText("GAME OVER", W / 2, 180, 52, "#ff35df");

  ctx.textAlign = "center";
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.fillStyle = "#fff";
  ctx.fillText(`SCORE: ${score}`, W / 2, 235);
  ctx.fillText(`HIGH SCORE: ${highScore}`, W / 2, 270);

  ctx.fillStyle = "#35f2ff";
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText("PRESS SPACE TO TRY AGAIN", W / 2, 330);
}

function draw() {
  ctx.save();

  if (shake > 1) {
    ctx.translate(
      (Math.random() - .5) * shake,
      (Math.random() - .5) * shake
    );
  }

  drawBackground();

  if (state === "title") {
    drawTitle();
  } else {
    for (const m of meteors) drawMeteor(m);
    drawPlayer();
    drawParticles();
    drawHUD();

    if (state === "gameover") {
      drawGameOver();
    }
  }

  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,50,220,${flash / 25})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
